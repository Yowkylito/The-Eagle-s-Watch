<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#2E63EA"/><stop offset="0.55" stop-color="#1440C2"/><stop offset="1" stop-color="#0A2788"/></linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.08" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0.30"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5"><stop offset="0" stop-color="#9CC0FF" stop-opacity="0.35"/><stop offset="1" stop-color="#9CC0FF" stop-opacity="0"/></radialGradient>
    <!-- inflated tile: soft bevel from the tile's own alpha -->
    <filter id="tileLight" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="h"/>
      <feSpecularLighting in="h" surfaceScale="9" specularConstant="0.8" specularExponent="30" lighting-color="#ffffff" result="s"><feDistantLight azimuth="240" elevation="58"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3="0.22" k4="0"/>
    </filter>
    <!-- glossy eagle: blurred silhouette as a height map -->
    <filter id="gloss" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="h"/>
      <feSpecularLighting in="h" surfaceScale="7" specularConstant="0.9" specularExponent="26" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="h2"/>
      <feSpecularLighting in="h2" surfaceScale="-5" specularConstant="0.6" specularExponent="16" lighting-color="#06123f" result="r"><feDistantLight azimuth="235" elevation="38"/></feSpecularLighting>
      <feComposite in="r" in2="SourceAlpha" operator="in" result="ri"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0" result="lit"/>
      <feComposite in="lit" in2="ri" operator="arithmetic" k1="0" k2="1" k3="0.25" k4="0"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#030b33" flood-opacity="0.55"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="tileClip"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <g filter="url(#tileLight)"><rect width="1024" height="1024" rx="232" fill="url(#tile)"/></g>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <!-- the flag's sun, tone-on-tone -->
    <g fill="#ffffff" fill-opacity="0.13"><path d="M542.0,226.0 L512.0,48.0 L482.0,226.0 Z"/><path d="M493.9,226.0 L462.0,118.7 L457.0,230.5 Z"/><path d="M567.0,230.5 L562.0,118.7 L530.1,226.0 Z"/><path d="M745.3,335.1 L850.0,188.0 L702.9,292.7 Z"/><path d="M711.4,301.0 L764.6,202.6 L682.0,278.1 Z"/><path d="M759.9,356.0 L835.4,273.4 L737.0,326.6 Z"/><path d="M812.0,556.0 L990.0,526.0 L812.0,496.0 Z"/><path d="M812.0,507.9 L919.3,476.0 L807.5,471.0 Z"/><path d="M807.5,581.0 L919.3,576.0 L812.0,544.1 Z"/><path d="M702.9,759.3 L850.0,864.0 L745.3,716.9 Z"/><path d="M737.0,725.4 L835.4,778.6 L759.9,696.0 Z"/><path d="M682.0,773.9 L764.6,849.4 L711.4,751.0 Z"/><path d="M482.0,826.0 L512.0,1004.0 L542.0,826.0 Z"/><path d="M530.1,826.0 L562.0,933.3 L567.0,821.5 Z"/><path d="M457.0,821.5 L462.0,933.3 L493.9,826.0 Z"/><path d="M278.7,716.9 L174.0,864.0 L321.1,759.3 Z"/><path d="M312.6,751.0 L259.4,849.4 L342.0,773.9 Z"/><path d="M264.1,696.0 L188.6,778.6 L287.0,725.4 Z"/><path d="M212.0,496.0 L34.0,526.0 L212.0,556.0 Z"/><path d="M212.0,544.1 L104.7,576.0 L216.5,581.0 Z"/><path d="M216.5,471.0 L104.7,476.0 L212.0,507.9 Z"/><path d="M321.1,292.7 L174.0,188.0 L278.7,335.1 Z"/><path d="M287.0,326.6 L188.6,273.4 L264.1,356.0 Z"/><path d="M342.0,278.1 L259.4,202.6 L312.6,301.0 Z"/></g>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect x="5" y="5" width="1014" height="1014" rx="227" fill="none" stroke="#fff" stroke-opacity="0.32" stroke-width="8" filter="url(#soft)"/>
  </g>

  <g filter="url(#drop)">
    <image x="205.6" y="196.0" width="612.8" height="660" xlink:href="eagle-glyph.png" filter="url(#gloss)"/>
  </g>
</svg>