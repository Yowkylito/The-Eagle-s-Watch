name: Screenshots

# Builds the web bundle, photographs every screen at phone and laptop widths, and commits the images to
# docs/review on the branch it ran from. Runs on pushes to the branch listed below, and by hand from the
# Actions tab once the workflow is on the default branch.

on:
  workflow_dispatch:
  push:
    branches: [ccr-19f68f74-x8w84c]
    paths-ignore: ["docs/**", "**.md", "licenses/**"]

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Web screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build production bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Take screenshots
        run: |
          (cd composeApp/build/dist/wasmJs/productionExecutable && python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
          sleep 2
          node tools/screenshots.js http://127.0.0.1:8765/ docs/review
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add review screenshots of the web build [skip ci]"
            git push
          fi
