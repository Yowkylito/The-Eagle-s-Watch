name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-265da269-vexky1, ccr-c56771b4-rfzny1, ccr-5d1dcef7-r4a5zw, ccr-19f68f74-x8w84c]
    paths-ignore: ["**.md", "docs/**", "licenses/**"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - name: Name the APK
        id: apk
        run: |
          TAG="v0.1.0-preview.${{ github.run_number }}"
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk "EaglesWatch-${TAG}.apk"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "file=EaglesWatch-${TAG}.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
      - name: Publish pre-release (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "The Eagle's Watch ${{ steps.apk.outputs.tag }}" \
            --notes "Design preview on a labelled sample dataset of ten fictional projects. No live government data.

          Debug-signed build for testing. To install, allow installs from unknown sources on your Android device (minSdk 24)."

  web:
    name: Web (Kotlin/Wasm) compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build production bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable
